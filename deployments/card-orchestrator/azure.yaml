{
  "$schema": "https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json",
  "name": "fantasy-cards-card-orchestrator",
  "resourceGroup": "${AZURE_RESOURCE_GROUP}",
  "requiredVersions": {
    "azd": ">= 1.32.0",
    "extensions": {"azure.ai.agents": "=1.0.0-beta.13"}
  },
  "infra": {"provider": "bicep", "path": "infra"},
  "services": {
    "card-orchestrator": {
      "project": ".",
      "host": "azure.ai.agent",
      "language": "docker",
      "kind": "hosted",
      "name": "card-orchestrator",
      "description": "Bounded text-only concept, lore and art-direction orchestration.",
      "docker": {
        "path": "../../hosted_agents/card_orchestrator/Dockerfile",
        "context": "../..",
        "platform": "linux/amd64",
        "remoteBuild": false,
        "registry": "${AZURE_CONTAINER_REGISTRY_ENDPOINT}",
        "image": "card-orchestrator",
        "tag": "${CARD_ORCHESTRATOR_VERSION}"
      },
      "container": {"resources": {"cpu": "0.5", "memory": "1Gi"}},
      "protocols": [{"protocol": "responses", "version": "2.0.0"}],
      "environmentVariables": [
        {"name": "AZURE_AI_MODEL_DEPLOYMENT_NAME", "value": "${AZURE_AI_MODEL_DEPLOYMENT_NAME}"},
        {"name": "CARD_ORCHESTRATOR_VERSION", "value": "${CARD_ORCHESTRATOR_VERSION}"}
      ]
    }
  }
}
