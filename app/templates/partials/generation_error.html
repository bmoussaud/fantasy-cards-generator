<div class="error-panel" role="alert">
    <input id="generate-idempotency-key" type="hidden" name="idempotency_key" value="{{ next_idempotency_key }}" hx-swap-oob="true" />
    <svg class="error-panel__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M12 3l9.5 17H2.5z" stroke-linejoin="round" />
        <path d="M12 9.5v4.5M12 17h.01" stroke-linecap="round" />
    </svg>
    <div class="error-panel__body">
        <h2>{{ error_title }}</h2>
        <p>{{ error_detail }}</p>
    </div>
</div>
