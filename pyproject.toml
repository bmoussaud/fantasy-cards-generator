[project]
name = "fantasy-cards-generator"
version = "0.1.0"
description = "Fantasy cards generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-cosmos>=4.9.0",
    "azure-identity>=1.23.0",
    "azure-storage-blob>=12.26.0",
    "authlib>=1.6.4",
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "python-dotenv>=1.1.1",
    "uvicorn>=0.35.0",
    "aiohttp>=3.14.3",
]

[dependency-groups]
dev = [
    "black>=26.0.0",
    "pytest>=8.4.1",
    "ruff>=0.12.10",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[[tool.uv.index]]
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
