[project]
name = "fantasy-cards-generator"
version = "0.1.0"
description = "Fantasy cards generator project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0.1"]

[dependency-groups]
dev = ["black>=26.0.0", "pytest>=8.4.0", "ruff>=0.12.10"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_cards_generator"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
