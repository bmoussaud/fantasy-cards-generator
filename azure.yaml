name: fantasy-cards-generator
requiredVersions:
  azd: ">= 1.32.0"
  extensions:
    azure.ai.agents: "=1.0.0-beta.13"
services:
  web-nat:
    project: .
    host: containerapp
    language: python
    docker:
      path: Dockerfile
      registry: ${AZURE_CONTAINER_REGISTRY_ENDPOINT}
  card-orchestrator:
    project: .
    host: azure.ai.agent
    language: docker
    kind: hosted
    name: card-orchestrator
    description: "Bounded text-only concept, lore and art-direction orchestration."
    docker:
      path: hosted_agents/card_orchestrator/Dockerfile
      context: .
      platform: linux/amd64
      remoteBuild: false
      registry: ${AZURE_CONTAINER_REGISTRY_ENDPOINT}
      image: card-orchestrator
      tag: ${CARD_ORCHESTRATOR_VERSION}
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    protocols:
      - protocol: responses
        version: "2.0.0"
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: CARD_ORCHESTRATOR_VERSION
        value: ${CARD_ORCHESTRATOR_VERSION}
      - name: TELEMETRY_ENABLED
        value: "true"
      - name: TELEMETRY_ENVIRONMENT
        value: ${AZURE_ENV_NAME}
      - name: AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING
        value: "true"
    hooks:
      prebuild:
        - shell: sh
          run: ./hooks/guard_agent_deploy.sh
      prepackage:
        - shell: sh
          run: ./hooks/guard_agent_deploy.sh
      prepublish:
        - shell: sh
          run: ./hooks/guard_agent_deploy.sh
      predeploy:
        - shell: sh
          run: ./hooks/guard_agent_deploy.sh
      postdeploy:
        - shell: sh
          run: ./hooks/sync_agent_deployment.sh
resources:
  web-nat:
    type: host.containerapp
    port: 8000
infra:
  provider: bicep
  path: infra
# Agent-only generation requires the hosted agent to exist before the web
# revision is configured for readiness. The first provision creates shared
# resources with the public placeholder image, agent deploy stamps its immutable
# name/version into azd state, and the second provision injects those exact
# values before the web image is deployed.
# azd 1.32 bare `deploy` targets all declared services, and no verified root-hook
# context distinguishes bare from targeted deploys before service hooks run.
# Bare `azd deploy` is therefore unsupported for this manifest.
# Use ./deploy.sh or targeted `azd deploy <service-name>` commands instead.
workflows:
  up:
    - azd: provision
    - azd: deploy card-orchestrator
    - azd: provision
    - azd: package web-nat
    - azd: deploy web-nat
hooks:
  preprovision:
    # Preserve an existing deployed web image so repeat provisioning cannot
    # replace it with the first-deploy bootstrap container.
    - shell: sh
      run: ./hooks/preserve_web_image.sh
    # Ensures APP_SESSION_SECRET_KEY is set before provisioning. If absent,
    # the Bicep conditional !empty(appSessionSecretKeyValue) silently omits the
    # ACA secret and env ref, causing a crash-loop on the next deployment.
    - shell: sh
      run: ./hooks/ensure_session_secret.sh
  postprovision:
    # Mint a credential only when Bicep explicitly reports that this deployment
    # manages the Entra registration; external/disabled modes fail closed.
    - shell: sh
      run: ./hooks/gen_client_secret.sh ENTRA_CLIENT_ID ENTRA_CLIENT_SECRET ENTRA_APP_REGISTRATION_MANAGED
