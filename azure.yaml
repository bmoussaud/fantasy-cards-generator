name: fantasy-cards-generator
services:
  web-nat:
    project: .
    host: containerapp
    language: python
    docker:
      path: Dockerfile
      registry: ${AZURE_CONTAINER_REGISTRY_ENDPOINT}
resources:
  web-nat:
    type: host.containerapp
    port: 8000
infra:
  provider: bicep
  path: infra
hooks:
  preprovision:
    # Ensures APP_SESSION_SECRET_KEY is set before provisioning. If absent,
    # the Bicep conditional !empty(appSessionSecretKeyValue) silently omits the
    # ACA secret and env ref, causing a crash-loop on the next deployment.
    - shell: sh
      run: ./hooks/ensure_session_secret.sh
  postprovision:
    # This hook is a no-op when ENTRA_CLIENT_ID is not present, which covers
    # environments provisioned with deployEntraAppRegistration=false.
    - shell: sh
      run: ./hooks/gen_client_secret.sh ENTRA_CLIENT_ID ENTRA_CLIENT_SECRET
