name: fantasy-cards-generator
services:
  web:
    project: .
    host: containerapp
    language: python
    docker:
      path: Dockerfile
      registry: ${AZURE_CONTAINER_REGISTRY_ENDPOINT}
resources:
  web:
    type: host.containerapp
    port: 8000
infra:
  provider: bicep
  path: infra
hooks:
  postprovision:
    # This hook is a no-op when ENTRA_CLIENT_ID is not present, which covers
    # environments provisioned with deployEntraAppRegistration=false.
    - shell: sh
      run: ./hooks/gen_client_secret.sh ENTRA_CLIENT_ID ENTRA_CLIENT_SECRET
